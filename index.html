<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0F1424" />
<title>Starship Tracker</title>
<meta name="description" content="Countdown to the next Starship flight, plus the story of every flight so far. Free, no ads.">

<!-- Link preview: what X, Reddit, WhatsApp, iMessage etc. show when someone shares the link -->
<meta property="og:title" content="Starship Tracker">
<meta property="og:description" content="Countdown to the next Starship flight, plus the story of every flight so far. Free, no ads.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://8costinha8.github.io/starship-tracker/">

<meta property="og:image:alt" content="Starship Tracker: next flight countdown and every flight so far">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Starship Tracker">
<meta name="twitter:description" content="Countdown to the next Starship flight, plus the story of every flight so far. Free, no ads.">
<meta name="twitter:image" content="https://8costinha8.github.io/starship-tracker/images/og-image-v20261114c.png">
<meta name="twitter:image:alt" content="Starship Tracker: next flight countdown and every flight so far">

<!-- PWA: makes the app installable with its own icon and name -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-v20261114c-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon-v20261114c-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="icons/icon-v20261114c-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-v20261114c-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Starship">

<!-- Energy design: tell the CSS whether this is the Home Screen app (standalone) or the Safari browser -->
<script>
(function(){var de=document.documentElement,mq=window.matchMedia&&matchMedia("(display-mode: standalone)");
function f(){var st=!!(navigator.standalone||(mq&&mq.matches));de.classList.toggle("v-standalone",st);de.classList.toggle("v-browser",!st);}
f();if(mq&&mq.addEventListener)mq.addEventListener("change",f);window.__vStandaloneSync=f;})();
</script>
<!-- Energy design: overscroll colours (top half matches the header, the rest the page) -->
<style>html { margin:0; background-color:#0D111D; background-image:linear-gradient(#0F1424,#0F1424); background-repeat:no-repeat; background-size:100% 50vh; } body { margin:0; background-color:#0D111D; }</style>

<!-- Start the big downloads early -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" as="style">
<link rel="preload" href="https://unpkg.com/react@18/umd/react.production.min.js" as="script">
<link rel="preload" href="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" as="script">
<link rel="preload" href="https://unpkg.com/@babel/standalone/babel.min.js" as="script">
<link rel="preload" href="images/f15-story/01-hero-ship-caught.jpg" as="image">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
</head>
<body>
<div id="root"></div>

<!-- Scripts are deferred: they download in parallel and run in this order once the page is parsed, so first paint isn't blocked. -->
<!-- React itself, loaded from a CDN so there's no install/build step -->
<script defer src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script defer src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel lets the browser understand JSX directly, so you can edit app.js as plain JSX.
     It stays in the browser on purpose: the checker edits app.js itself (it logs new flights), so a pre-built
     app.compiled.js would go stale without a CI build step. -->
<script defer src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Firebase + notification logic: must load BEFORE app.js, since app.js
     checks window.STNotify as soon as it starts up -->
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="notifications.js"></script>
<script defer src="scripts/cleanup.js"></script>
<script defer src="scripts/flightlog.js"></script>
<script defer src="scripts/handover.js"></script>
<script defer src="scripts/road-pick.js"></script>

<!-- No pinch-zoom-out bounce: the iOS elastic pinch shrinks the whole page (header included) and springs back.
     touch-action stops the pinch on modern iOS; the gesture* listeners cover Safari/home-screen mode.
     Zoom for accessibility stays available through iOS Accessibility Zoom. -->
<style>html.fx-nopinch { touch-action: pan-x pan-y; }</style>
<script>
(function () {
  function on() { try { return window.SBX && typeof window.SBX.flag === "function" ? !!window.SBX.flag("noPinch") : true; } catch (e) { return true; } }
  function sync() { document.documentElement.classList.toggle("fx-nopinch", on()); }
  sync(); window.addEventListener("load", sync);
  ["gesturestart", "gesturechange", "gesturend"].forEach(function (t) {
    document.addEventListener(t, function (e) { if (on()) e.preventDefault(); }, { passive: false });
  });
})();
</script>

<!-- Babel compiles this once the deferred scripts above have run (on DOMContentLoaded) -->
<script type="text/babel" src="app.js"></script>
</body>
</html>

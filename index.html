<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2E3D63" />
<title>Starship Tracker</title>

<!-- PWA: makes the app installable with its own icon and name -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Starship">

<style>html, body { margin:0; background: radial-gradient(130% 55% at 50% -8%, #2E3D63 0%, #1A2236 62%) #1A2236; }</style>
</head>
<body>
<div id="root"></div>

<!-- React itself, loaded from a CDN so there's no install/build step -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel lets the browser understand JSX directly, so you can edit app.js as plain JSX -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Firebase + notification logic: must load BEFORE app.js, since app.js
     checks window.STNotify as soon as it starts up -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="notifications.js"></script>

<script type="text/babel" src="app.js"></script>
</body>
</html>

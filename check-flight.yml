name: Check Starship flight changes

on:
  schedule:
    - cron: "5 * * * *"   # every hour, at 5 minutes past — free, no billing account needed
  workflow_dispatch: {}    # adds a "Run workflow" button in the Actions tab, for testing on demand

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin
      - run: node scripts/check-flight.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

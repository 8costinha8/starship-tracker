<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Starship Tracker · Recent pushes</title>
<style>
  :root {
    --bg: #ffffff; --fg: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --chip: #f3f4f6; --accent: #2563eb; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --fg: #e8eaee; --muted: #9aa3b2; --line: #2a2f39;
      --chip: #1d2129; --accent: #7aa7ff; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 12px; max-width: 720px; margin: 0 auto;
    -webkit-text-size-adjust: 100%;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; }
  #updated { font-size: 12px; color: var(--muted); }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: 9px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .title { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
  .time { font-size: 12px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  .body { margin: 2px 0 0; overflow-wrap: anywhere; }
  .meta { margin-top: 3px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tag { background: var(--chip); color: var(--muted); border-radius: 4px; padding: 0 5px; font-size: 11px; }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  li.retracted .title, li.retracted .body { color: var(--muted); }
  .state { padding: 16px 0; color: var(--muted); }
  .state.error { color: var(--err); }
  button { font: inherit; font-size: 13px; margin-left: 8px; padding: 3px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer; }
  @media (max-width: 360px) { .top { flex-direction: column; gap: 0; } }
</style>
</head>
<body>
<header>
  <h1>Recent push notifications</h1>
  <span id="updated" aria-live="polite"></span>
</header>
<main id="root"><div class="state" role="status">Loading…</div></main>
<script>
(function () {
  "use strict";
  var LIMIT = 10, REFRESH_MS = 60000, TZ = "Europe/London";
  var root = document.getElementById("root");
  var updatedEl = document.getElementById("updated");
  var timer = null, loading = false;

  function fmtParts(d, opts) {
    var p = {};
    new Intl.DateTimeFormat("en-GB", Object.assign({ timeZone: TZ }, opts)).formatToParts(d)
      .forEach(function (x) { p[x.type] = x.value; });
    return p;
  }
  function fmtSent(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var p = fmtParts(d, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
    return p.day + " " + p.month + ", " + p.hour + ":" + p.minute + " UK";
  }
  function fmtNow() {
    var p = fmtParts(new Date(), { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
    return p.hour + ":" + p.minute + " UK";
  }
  function safeUrl(u) {
    if (typeof u !== "string" || !u) return null;
    try { var x = new URL(u, location.href); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : null; }
    catch (e) { return null; }
  }
  function str(v) { return typeof v === "string" ? v : (v == null ? "" : String(v)); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function when(p) { return str(p.sent_at) || str(p.at); }
  function ts(p) { var t = Date.parse(when(p)); return isNaN(t) ? -Infinity : t; }

  function pick(data) {
    if (!data || typeof data !== "object" || !Array.isArray(data.pushes)) throw new Error("Unexpected data format");
    return data.pushes
      .filter(function (p) { return p && typeof p === "object" && p.verdict === "sent"; })
      .map(function (p, i) { return { p: p, i: i }; })
      .sort(function (a, b) { return (ts(b.p) - ts(a.p)) || (b.i - a.i); })
      .slice(0, LIMIT)
      .map(function (x) { return x.p; });
  }

  function showState(msg, isError) {
    var d = el("div", "state" + (isError ? " error" : ""), msg);
    d.setAttribute("role", isError ? "alert" : "status");
    if (isError) {
      var b = el("button", null, "Retry");
      b.type = "button";
      b.addEventListener("click", function () { showState("Loading…"); load(); });
      d.appendChild(b);
    }
    root.replaceChildren(d);
  }

  function render(items) {
    if (!items.length) { showState("No sent notifications yet"); return; }
    var ol = el("ol");
    items.forEach(function (p) {
      var li = el("li", p.retracted ? "retracted" : null);
      var top = el("div", "top");
      top.appendChild(el("span", "title", str(p.title) || "(no title)"));
      var t = el("time", "time", fmtSent(when(p)));
      t.dateTime = when(p);
      top.appendChild(t);
      li.appendChild(top);
      if (str(p.body)) li.appendChild(el("p", "body", str(p.body)));
      var meta = el("div", "meta");
      meta.appendChild(el("span", null, "Sent"));
      if (p.retracted) meta.appendChild(el("span", "tag", "Retracted"));
      var href = safeUrl(p.link) || safeUrl(p.url);
      if (href) {
        var a = el("a", null, "Open");
        a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
        meta.appendChild(a);
      }
      li.appendChild(meta);
      ol.appendChild(li);
    });
    root.replaceChildren(ol);
  }

  function load() {
    if (loading) return;
    loading = true;
    fetch("notifications.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (txt) {
        var data;
        try { data = JSON.parse(txt); } catch (e) { throw new Error("Malformed data"); }
        render(pick(data));
        updatedEl.textContent = "Updated " + fmtNow();
      })
      .catch(function (e) {
        updatedEl.textContent = "";
        showState("Couldn't load notifications (" + (e && e.message ? e.message : "network error") + ").", true);
      })
      .then(function () { loading = false; });
  }

  function schedule() {
    clearInterval(timer); timer = null;
    if (document.visibilityState === "visible") timer = setInterval(load, REFRESH_MS);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") load();
    schedule();
  });
  load();
  schedule();
})();
</script>
</body>
</html>
